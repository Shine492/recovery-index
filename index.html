<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主恢復內容索引</title>
<style>
:root{
  --bg:#f6f2e9;--card:#fffdf8;--ink:#23302c;--muted:#6f766f;--line:#e4dccb;
  --green:#1f3d36;--green-ink:#fff;--soft:#efe9dc;--mark:#f3dc8a;--accent:#8b5e3c;
  --c-rv:#2f5d50;--c-ls:#8b5e3c;--c-nee:#4f7186;--c-lee:#75598a;--c-outl:#a9772a;--c-ac:#8c4a4a;
  --hero1:#e9e0cc;--hero2:#f6f2e9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171b19;--card:#202623;--ink:#e9e6dc;--muted:#a2a89f;--line:#343b37;
  --green:#7fb8a4;--green-ink:#10201b;--soft:#2a312d;--mark:#6a5a17;--accent:#d6a676;
  --c-rv:#5fa890;--c-ls:#c9966a;--c-nee:#7fa6bd;--c-lee:#a98bc0;--c-outl:#d3a04d;--c-ac:#c98080;
  --hero1:#222a26;--hero2:#171b19;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;
  font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif}
.serif{font-family:"Noto Serif TC","PMingLiU","Songti TC",serif}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header .logo{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-weight:700}
header .name{font-size:1.2rem;letter-spacing:.08em}
header .tag{font-size:.78rem;color:var(--muted);letter-spacing:.2em}
.hero{padding:26px 24px 30px;background:linear-gradient(120deg,var(--hero1),var(--hero2) 70%);border-bottom:1px solid var(--line)}
.hero-in,.wrap{max-width:1180px;margin:0 auto}
.hero h1{margin:0;font-size:1.9rem;font-weight:500;letter-spacing:.04em}
.hero p{margin:4px 0 0;color:var(--muted)}
.wrap{padding:22px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:0;background:var(--soft);color:var(--ink);padding:8px 22px;border-radius:8px;font-size:1rem;cursor:pointer;font-family:inherit}
.tab.on{background:var(--green);color:var(--green-ink);font-weight:700}
.row{display:flex;gap:12px;align-items:stretch}
textarea{flex:1;min-height:52px;padding:12px 14px;font-size:1.05rem;font-family:inherit;line-height:1.6;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
.go{border:0;background:var(--green);color:var(--green-ink);border-radius:10px;padding:0 34px;font-size:1.05rem;font-weight:700;letter-spacing:.3em;cursor:pointer;font-family:inherit;min-height:52px}
.go:disabled{opacity:.5;cursor:wait}
.hint{color:var(--muted);font-size:.86rem;margin:8px 2px 0}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.92rem;color:var(--muted)}
.opts input[type=number]{width:58px;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.92rem}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.82rem;background:var(--bg)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:22px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}.row{flex-direction:column}.go{padding:10px}}
.side{position:sticky;top:12px}
.side h3{margin:0 0 8px;font-size:1.02rem;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:8px}
.src{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:.97rem}
.src input{accent-color:var(--green);width:17px;height:17px}
.dot{width:8px;height:8px;border-radius:50%}
.src .n{margin-left:auto;color:var(--muted);font-size:.86rem}
.src.zero{opacity:.45}
.side .mini{margin-top:10px;display:flex;gap:10px;font-size:.86rem}
.side .mini a{color:var(--accent);cursor:pointer;text-decoration:underline}
.sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:2px 2px 12px}
.sum b{font-size:1.5rem;font-weight:500}
.sum small{color:var(--muted)}
.qbox{margin:22px 0 10px;padding:10px 16px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0}
.qbox small{display:block;color:var(--muted);font-size:.82rem}
.res{display:grid;grid-template-columns:54px 1fr;gap:14px;margin:12px 0}
.res .no{align-self:start;background:var(--soft);border-radius:10px;text-align:center;padding:8px 0;color:var(--muted);font-size:.95rem}
.res .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{color:#fff;font-size:.82rem;font-weight:700;padding:1px 10px;border-radius:6px;white-space:nowrap}
@media (prefers-color-scheme:dark){.badge{color:#111}}
.res .title{font-size:1.08rem}
.res .title a{color:inherit;text-decoration:none}
.res .title a:hover{text-decoration:underline}
.score{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.body{margin:8px 0 8px;font-size:1.05rem}
.ctx{color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.path{color:var(--muted);font-size:.86rem;border-top:1px dashed var(--line);padding-top:6px}
.none{color:var(--muted);padding:8px 4px}
.notes{margin-top:26px;color:var(--muted);font-size:.9rem}
.notes b{color:var(--ink)}
.err{color:#b3261e}
</style>
</head>
<body>
<header>
  <div class="logo serif">源</div>
  <div><div class="name serif">主恢復內容索引</div><div class="tag">職事文字索引</div></div>
</header>
<section class="hero"><div class="hero-in">
  <h1 class="serif" id="heroTitle">找出一句話的出處</h1>
  <p id="heroSub">聖經恢復本・生命讀經・倪柝聲文集・李常受文集・特會訓練綱要・肯定與否定</p>
</div></section>

<div class="wrap">
  <div class="card">
    <div class="tabs" id="tabs">
      <button class="tab on" data-mode="auto">自動判斷</button>
      <button class="tab" data-mode="sentence">找出處</button>
      <button class="tab" data-mode="keyword">關鍵詞</button>
    </div>
    <div class="row">
      <textarea id="q" rows="1" placeholder="貼上句子或整段；或輸入幾個詞（用空白隔開）"></textarea>
      <button class="go" id="go">搜尋</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="opts">
      <span><kbd>Enter</kbd> 搜尋　<kbd>Shift</kbd>+<kbd>Enter</kbd> 換行</span>
      <label>相似度門檻 <input type="number" id="th" value="90" min="50" max="100">%</label>
      <label><input type="checkbox" id="cw" checked> 李常受文集（線上查詢，較慢）</label>
      <label><input type="checkbox" id="ctx" checked> 顯示前後文</label>
    </div>
  </div>

  <div class="layout" id="layout" hidden>
    <aside class="card side">
      <h3 class="serif">來源篩選</h3>
      <div id="srcs"></div>
      <div class="mini"><a onclick="setAll(true)">全選</a><a onclick="setAll(false)">全不選</a></div>
    </aside>
    <main id="out"></main>
  </div>
  <div id="msg"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const SOURCES = [
  ['聖經恢復本','--c-rv'],['生命讀經','--c-ls'],['倪柝聲文集','--c-nee'],
  ['李常受文集','--c-lee'],['特會訓練綱要','--c-outl'],['肯定與否定','--c-ac']];
const COLOR = Object.fromEntries(SOURCES);
const HINTS = {
  auto:'自動判斷：沒有標點、只有幾個短詞就當關鍵詞搜尋；其餘當句子找出處。',
  sentence:'找出處：逐句比對，列出完全相同或相似度達門檻的句子。',
  keyword:'關鍵詞：最多 4 個詞，用空白隔開，找出同一段裏都有這些詞的地方，並列出約 30 字原文。'};
let mode = 'auto', data = null, enabled = new Set(SOURCES.map(s=>s[0])), elapsed = 0;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  mode = b.dataset.mode;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('#hint').textContent = HINTS[mode];
});
$('#hint').textContent = HINTS.auto;

const ta = $('#q');
function grow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight+2,320)+'px'; }
ta.addEventListener('input',grow);
ta.addEventListener('keydown',e=>{
  // Enter 搜尋；Shift+Enter 換行；中文輸入法選字中的 Enter 不觸發
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); run(); }
});
$('#go').onclick = run;

async function run(){
  const text = ta.value.trim();
  if(!text) return;
  $('#go').disabled = true; $('#msg').innerHTML = '<p class="none">搜尋中…</p>'; $('#layout').hidden = true;
  const t0 = performance.now();
  try{
    const r = await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, threshold:+$('#th').value||90, cwwl:$('#cw').checked, mode})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    data = d; elapsed = (performance.now()-t0)/1000;
    enabled = new Set(SOURCES.map(s=>s[0]));
    $('#msg').innerHTML=''; $('#layout').hidden=false; render();
  }catch(e){ $('#msg').innerHTML = `<p class="err">發生錯誤：${esc(e.message)}</p>`; }
  $('#go').disabled = false;
}

// 把兩種模式的結果整理成同一種「區段」結構
function sections(d){
  if(d.mode==='keyword'){
    const items=[]; SOURCES.forEach(([k])=>{ if(d.groups[k]) d.groups[k].items.forEach(r=>items.push(r)); });
    return [{head:'', items}];
  }
  return d.sentences.map((s,i)=>({
    head:`<div class="qbox"><small>第 ${i+1} 句</small>${esc(s.query)}</div>`, items:s.results}));
}
function counts(d){
  const c={};
  if(d.mode==='keyword') Object.entries(d.groups).forEach(([k,g])=>c[k]=g.total);
  else d.sentences.forEach(s=>s.results.forEach(r=>c[r.source]=(c[r.source]||0)+1));
  return c;
}
function render(){
  const d=data, c=counts(d), showCtx=$('#ctx').checked;
  const total=Object.values(c).reduce((a,b)=>a+b,0);
  $('#srcs').innerHTML = SOURCES.map(([k,v])=>`<label class="src ${c[k]?'':'zero'}">
    <input type="checkbox" ${enabled.has(k)?'checked':''} onchange="tog('${k}',this.checked)">
    <span class="dot" style="background:var(${v})"></span>${k}<span class="n">${c[k]||0}${d.mode==='keyword'&&d.capped&&c[k]?'+':''}</span></label>`).join('');
  if(d.mode==='keyword'){
    $('#heroTitle').textContent = `「${d.terms.join(' ')}」的搜尋結果`;
    $('#heroSub').textContent = `關鍵詞搜尋・同一段裏同時出現・共 ${total}${d.capped?'+':''} 段`;
  }else{
    $('#heroTitle').textContent = '出處比對結果';
    $('#heroSub').textContent = `共 ${d.sentences.length} 句・找到 ${total} 筆`;
  }
  let h = `<div class="sum"><b class="serif">${total}${d.mode==='keyword'&&d.capped?'+':''}</b> 筆搜尋結果 <small>約 ${elapsed.toFixed(2)} 秒</small></div>`;
  let ocr=false, shownAll=0, neeConv=false, outlConv=false;
  sections(d).forEach(sec=>{
    h += sec.head;
    const items = sec.items.filter(r=>enabled.has(r.source));
    if(!items.length){ h += `<div class="none">${sec.items.length?'符合的結果都被來源篩選隱藏了。':'找不到符合的內容。'}</div>`; return; }
    items.forEach((r,i)=>{
      shownAll++; if(r.source==='特會訓練綱要'){ ocr=true; if(r.converted) outlConv=true; }
      if(r.source==='倪柝聲文集' && r.converted) neeConv=true;
      const path=[r.source, r.title, r.label].filter(Boolean).map(esc).join(' › ');
      h += `<div class="res"><div class="no">#${i+1}</div><div class="card">
        <div class="top"><span class="badge" style="background:var(${COLOR[r.source]})">${r.source}</span>
          <span class="title serif"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a></span>
          ${r.score!=null?`<span class="score">${r.score}%</span>`:''}</div>
        <div class="body">${showCtx&&r.before?`<span class="ctx">${r.before}</span>`:''}${r.snippet}${showCtx&&r.after?`<span class="ctx">${r.after}</span>`:''}</div>
        <div class="path">${path}${r.kind?' · '+r.kind:''}</div></div></div>`;
    });
  });
  const notes=[];
  if(d.mode==='keyword'){
    Object.entries(d.groups).forEach(([k,g])=>{ if(g.total>g.items.length) notes.push(`${k}共 ${g.total} 段，只列出前 ${g.items.length} 筆。`); });
    if(d.truncated) notes.push('關鍵詞最多 4 個，超過的部分已略過。');
    if(d.capped) notes.push('本機資料符合的段落太多，只檢查了前 4000 段；可再多加一個詞縮小範圍。');
  }
  if(outlConv) notes.push('部分《特會訓練綱要》的原檔是簡體版，已自動轉為繁體（臺灣用字）顯示；點標題開啟的原 PDF 仍為簡體。');
  if(neeConv) notes.push('《倪柝聲文集》網站原文為簡體字，已自動轉為繁體（臺灣用字）顯示，個別字形可能與繁體版原書略有不同；點連結看到的原網頁仍為簡體。');
  if(ocr) notes.push('《特會訓練綱要》原檔是沒有文字層的 PDF，內容是用文字辨識（OCR）取得的，可能有少數錯字；請點標題開啟原 PDF 核對。');
  if(d.input_converted) notes.push('您輸入的文字含簡體字，已轉為繁體顯示；比對時繁簡視為相同。');
  if(d.cwwl_failed) notes.push('李常受文集線上索引這次連線失敗或逾時，結果可能不完整，可稍後再試。');
  (d.sources_missing||[]).forEach(m=>notes.push(m));
  if(notes.length) h += `<div class="card notes"><b>調整說明</b><br>${notes.map(n=>'・'+esc(n)).join('<br>')}</div>`;
  $('#out').innerHTML = h;
}
function tog(k,on){ on?enabled.add(k):enabled.delete(k); render(); }
function setAll(on){ enabled = new Set(on?SOURCES.map(s=>s[0]):[]); render(); }
$('#ctx').onchange = ()=>{ if(data) render(); };
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
</body>
</html>
